[package]
name = "bip32-ed25519"
version = "0.2.2"
authors = ["Shift Crypto AG <support@shiftcrypto.ch>"]
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["no_std"]
categories = ["cryptography", "no-std"]
description = "BIP32-Ed25519"

[dependencies]
digest = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
curve25519-dalek = { version = "5.0", default-features = false }
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[dev-dependencies]
sha2 = { version = "0.11", default-features = false }
quickcheck = "1.1"
quickcheck_macros = "1.2"
num-bigint = "0.5.1"
# Used to test that the private keys are valid and can be used to sign messages.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["hazmat"] }
# Used to compare our implementation in a table test:
ed25519-bip32 = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = { version = "0.4.3", features = ["serde"] }
